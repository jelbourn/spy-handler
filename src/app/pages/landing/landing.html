<div class="landing-content">
  <!-- Authentication Form -->
  <form class="auth-form" (submit)="onSubmit($event)">
    <!-- Username Field -->
    <div class="form-group">
      <label for="handler-id" class="form-label">HANDLER ID:</label>
      <div class="input-bracket-box">
        <span class="bracket" aria-hidden="true">[</span>
        <input id="handler-id" name="username" type="text" class="typewriter-input" [ngModel]="username()"
          (ngModelChange)="username.set($event)" autocomplete="username" required />
        <span class="bracket" aria-hidden="true">]</span>
      </div>
    </div>

    <!-- Passcode Field -->
    <div class="form-group">
      <label for="cipher-passcode" class="form-label">CIPHER PASSCODE:</label>
      <div class="input-bracket-box">
        <span class="bracket" aria-hidden="true">[</span>
        <input id="cipher-passcode" name="passcode" type="password" class="typewriter-input" [ngModel]="passcode()"
          (ngModelChange)="passcode.set($event)" autocomplete="current-password" required />
        <span class="bracket" aria-hidden="true">]</span>
      </div>
    </div>
    @if (errorMessage()) {
    <p class="error-banner" role="alert">! {{ errorMessage() }}</p>
    }

    <!-- Submit Button -->
    <button type="submit" class="dymo-button" [disabled]="isSigningIn()">
      <span class="button-pip" aria-hidden="true">■</span>
      <span class="button-text">{{ isSigningIn() ? '[ AUTHENTICATING... ]' : '[ AUTHENTICATE CLEARANCE ]' }}</span>
      <span class="button-pip" aria-hidden="true">■</span>
    </button>
  </form>

  <hr class="inner-divider" />

  <!-- Navigation Link -->
  <nav class="dossier-footer">
    <a routerLink="/sign-up" class="typewriter-link">
      UNREGISTERED AGENT? SIGN-UP
    </a>
  </nav>
</div>
