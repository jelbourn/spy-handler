<main class="desk-surface">

      <span class="tab-text">CLEARANCE: LEVEL 4 &nbsp;|&nbsp; SEC-ORD // 62-0941</span>

    <!-- Main Dossier Card Shell -->
    <article class="dossier-card">
      <!-- Watermark Compass Seal -->

        <circle cx="200" cy="200" r="180" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6,4"/>
        <circle cx="200" cy="200" r="145" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <polygon points="200,30 216,184 370,200 216,216 200,370 184,216 30,200 184,184" fill="currentColor" fill-opacity="0.85"/>

      <!-- Department Identification Header -->

      <!-- Page Content Outlet -->

      <div class="card-bottom-groove" aria-hidden="true"></div>
